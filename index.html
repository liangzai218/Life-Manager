function handleImportFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => { document.getElementById('import-data').value = e.target.result; };
    reader.readAsText(file);
}

function analyzeImportData() {
    const raw = document.getElementById('import-data').value.trim();
    if (!raw) { showToast('请粘贴或选择数据文件'); return; }
    let data;
    try { data = JSON.parse(raw); } catch (e) { showToast('JSON 格式错误'); return; }
    const detectedModules = [];
    if (Array.isArray(data.tasks)) detectedModules.push({ key: 'tasks', label: '打卡数据', count: data.tasks.length });
    if (Array.isArray(data.incomes)) detectedModules.push({ key: 'incomes', label: '收入记录', count: data.incomes.length });
    if (Array.isArray(data.expenses)) detectedModules.push({ key: 'expenses', label: '支出记录', count: data.expenses.length });
    if (Array.isArray(data.notes)) detectedModules.push({ key: 'notes', label: '记事数据', count: data.notes.length });
    if (data.menstrual) detectedModules.push({ key: 'menstrual', label: '经期数据', count: (data.menstrual.records || []).length });
    if (detectedModules.length === 0) { showToast('未识别到有效数据'); return; }
    const moduleListHtml = detectedModules.map(m =>
        `<div class="flex items-center justify-between py-2 px-3 rounded-lg bg-gray-50 mb-1.5">
            <div class="flex items-center gap-2">
                <input type="checkbox" id="import-module-${m.key}" checked class="w-4 h-4">
                <label for="import-module-${m.key}" class="text-sm font-medium text-gray-700">${m.label}</label>
            </div>
            <span class="text-xs text-gray-400">${m.count} 条</span>
        </div>`
    ).join('');
    window._pendingImportData = data;
    const html = `
        <div class="p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold">选择导入模块</h3>
                <button onclick="closeModal()" class="p-2 rounded-full bg-gray-100"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <p class="text-xs text-gray-500 mb-3">检测到以下数据，勾选需要导入的模块（导入会覆盖对应模块的现有数据）：</p>
            <div class="mb-4">${moduleListHtml}</div>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-medium text-sm">取消</button>
                <button onclick="confirmImport()" class="flex-1 py-3 rounded-xl btn-primary font-medium text-sm">确认导入</button>
            </div>
        </div>
    `;
    openModal(html);
}

async function confirmImport() {
    const data = window._pendingImportData;
    if (!data) { showToast('数据丢失，请重试'); return; }
    const selectedModules = [];
    if (document.getElementById('import-module-tasks')?.checked) selectedModules.push('tasks');
    if (document.getElementById('import-module-incomes')?.checked) selectedModules.push('incomes');
    if (document.getElementById('import-module-expenses')?.checked) selectedModules.push('expenses');
    if (document.getElementById('import-module-notes')?.checked) selectedModules.push('notes');
    if (document.getElementById('import-module-menstrual')?.checked) selectedModules.push('menstrual');
    if (selectedModules.length === 0) { showToast('请至少选择一个模块'); return; }
    const confirmed = await showCustomConfirm('确定导入选中的模块吗？对应模块的现有数据将被覆盖。');
    if (!confirmed) return;
    const details = [];
    if (selectedModules.includes('tasks') && Array.isArray(data.tasks)) {
        const cleaned = data.tasks.map(sanitizeTask).filter(Boolean);
        appData.tasks = cleaned;
        details.push(`打卡 ${cleaned.length} 条`);
    }
    if (selectedModules.includes('incomes') && Array.isArray(data.incomes)) {
        const cleaned = data.incomes.map(sanitizeIncome).filter(Boolean);
        appData.incomes = cleaned;
        details.push(`收入 ${cleaned.length} 条`);
    }
    if (selectedModules.includes('expenses') && Array.isArray(data.expenses)) {
        const cleaned = data.expenses.map(sanitizeExpense).filter(Boolean);
        cleaned.forEach(e => {
            if (!e.subCategory && e.note) {
                const parsed = parseLegacyNote(e.category, e.note);
                e.subCategory = parsed.subCategory;
                e.note = parsed.note;
            }
        });
        appData.expenses = cleaned;
        details.push(`支出 ${cleaned.length} 条`);
    }
    if (selectedModules.includes('notes') && Array.isArray(data.notes)) {
        const cleaned = data.notes.map(sanitizeNote).filter(Boolean);
        appData.notes = cleaned;
        details.push(`记事 ${cleaned.length} 条`);
    }
    if (selectedModules.includes('menstrual') && data.menstrual) {
        appData.menstrual = {
            records: (data.menstrual.records || []).map(sanitizeMenstrualRecord).filter(Boolean),
            loveDates: (data.menstrual.loveDates || []).map(sanitizeLoveDate).filter(Boolean)
        };
        details.push(`经期 ${appData.menstrual.records.length} 条`);
    }
    lastSyncData = null;
    const _accountKey = appData.settings.giteeFilename || '_default';
    localStorage.removeItem('life_manager_last_sync_data_' + _accountKey);
    window._pendingImportData = null;
    saveData();
    logOp('导入数据', details.join(' / '));
    showToast('导入成功'); closeModal(); switchTab(currentTab,true);
}

async function doOneClickFill() {
    const raw = document.getElementById('fill-config-data').value.trim();

    try {
        const config = JSON.parse(raw);

                switchTab('home', true);
                showToast('配置已更新，正在上传数据...');

            }
        } else {

        }
    } catch (e) { showToast('JSON格式错误'); }
}

// L0 层防御：向系统申请持久化存储（防止 iOS 7天不活跃清理）
async function requestPersistentStorage() {
    if (navigator.storage && navigator.storage.persist) {
        const isPersisted = await navigator.storage.persisted();
        if (!isPersisted) {
            const granted = await navigator.storage.persist();
            console.log('持久化存储申请:', granted ? '已授予' : '未授予');
        }
    }
}

// 键盘弹出处理（通过可视区域高度精准判断，彻底解决“单独收起键盘”不恢复的问题）
let _keyboardHideTimer = null;
function showKeyboardUI() {
    document.body.classList.add('keyboard-open');
    // 确保输入框可见
    const t = document.activeElement;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
        setTimeout(() => {
            try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
        }, 100);
    }
}
function hideKeyboardUI() {
    document.body.classList.remove('keyboard-open');
}

if (window.visualViewport) {
    // 现代设备：直接监听屏幕可视高度变化
    let _initialHeight = window.visualViewport.height;
    window.visualViewport.addEventListener('resize', () => {
        // 如果高度缩水 100px 以上，说明键盘弹起了
        if (window.visualViewport.height < _initialHeight - 100) {
            showKeyboardUI();
        } else {
            // 高度恢复，说明键盘收起了（不管焦点丢没丢）
            hideKeyboardUI();
        }
    });
    
    // 旋转屏幕时重置初始高度
    window.addEventListener('orientationchange', () => {
        setTimeout(() => { _initialHeight = window.visualViewport.height; }, 300);
    });
} else {
    // 老旧浏览器兜底：只能靠焦点事件
    document.addEventListener('focusin', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
            if (_keyboardHideTimer) { clearTimeout(_keyboardHideTimer); _keyboardHideTimer = null; }
            showKeyboardUI();
        }
    });
    document.addEventListener('focusout', () => {
        if (_keyboardHideTimer) clearTimeout(_keyboardHideTimer);
        _keyboardHideTimer = setTimeout(hideKeyboardUI, 120);
    });
}


// ==================== 性能优化：滚动监听 & FAB 按钮 ====================
let _isScrolling = false;

window.addEventListener('scroll', () => {
    if (_isScrolling) return;
    _isScrolling = true;
    requestAnimationFrame(() => {
        const fab = document.getElementById('fab-add-btn');
        if (!fab || fab.style.display === 'none') {
            _fabLastY = window.scrollY;
            _isScrolling = false;
            return;
        }
        const y = window.scrollY;
        
        if (y < 50) {
            if (_fabHidden) {
                _fabHidden = false;
                fab.style.transform = '';
                fab.style.opacity = '1';
                fab.style.pointerEvents = 'auto';
            }
            _fabLastY = y;
            _isScrolling = false;
            return;
        }
        
        const delta = y - _fabLastY;
        if (delta > 20 && !_fabHidden) {
            _fabHidden = true;
            fab.style.transform = 'translateY(120px)';
            fab.style.opacity = '0';
            fab.style.pointerEvents = 'none';
            _fabLastY = y;
        } else if (delta < -20 && _fabHidden) {
            _fabHidden = false;
            fab.style.transform = '';
            fab.style.opacity = '1';
            fab.style.pointerEvents = 'auto';
            _fabLastY = y;
        } else if ((delta > 0 && _fabHidden) || (delta < 0 && !_fabHidden)) {
            _fabLastY = y;
        }
        _isScrolling = false;
    });
}, { passive: true });

// 更新弹窗（复用已有的 showChoiceConfirm 组件）
async function showUpdatePrompt(worker) {
    if (_isUpdatePromptActive) return; // 弹窗锁：防止刚进App时多次触发
    _isUpdatePromptActive = true;
    _waitingWorker = worker;

    let versionStr = '新版本';
    let logsStr = '发现应用更新，建议立即重启以获取最新体验。';
    try {
        const res = await fetch('./version.json?t=' + Date.now());
        if (res.ok) {
            const data = await res.json();
    const latest = data[0]; // 取最新版本
    versionStr = 'v' + latest.version;
    if (latest.logs && latest.logs.length > 0) {
        logsStr = latest.logs.map(l => '· ' + l).join('\n');
    }
        }
    } catch(e) { console.warn('获取版本信息失败', e); }

    const choice = await showChoiceConfirm(
        '发现新版本 ' + versionStr,
        logsStr,
        [
            { label: '立即更新', value: 'update', primary: true },
            { label: '稍后更新', value: 'cancel' }
        ]
    );

    if (choice === 'update') {
        if (_waitingWorker) {
            _waitingWorker.postMessage({ action: 'skipWaiting' });
        } else {
            window.location.reload();
        }
    } else {
        _isUpdatePromptActive = false; // 用户选稍后，释放锁
    }
}

// 手动检查更新（供设置页调用）
async function checkForUpdatesManual() {
    if (!_swRegistration) {
        showToast('当前环境不支持检查更新');
        return;
    }
    
    // 1. 优先检查等待队列（防止重复下载打架）
    if (_swRegistration.waiting) {
        if (_isUpdatePromptActive) {
            showToast('更新弹窗已在屏幕上');
        } else {
            showUpdatePrompt(_swRegistration.waiting);
        }
        return;
    }

    // 2. 队列为空，去网络拉取
    showToast('正在检查更新...');
    try {
        await _swRegistration.update();
        setTimeout(() => {
            if (_swRegistration.waiting) {
                showUpdatePrompt(_swRegistration.waiting);
            } else if (!_isUpdatePromptActive) {
                showToast('当前已是最新版本');
            }
        }, 1500);
    } catch (e) {
        showToast('网络异常，检查更新失败');
    }
}

// 注册 PWA Service Worker
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then(reg => {
            _swRegistration = reg;
            console.log('PWA 已注册!');
            
            // 监听后台自动下载完毕
            reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        showUpdatePrompt(newWorker);
                    }
                });
            });

            // 如果用户上次点了稍后，但文件还在等待，延迟2秒弹出提醒
            if (reg.waiting) {
                setTimeout(() => showUpdatePrompt(reg.waiting), 2000);
            }
        }).catch(err => console.log('PWA 注册失败!', err));

        // 监听控制权接管，平滑刷新
        let refreshing;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
        });
    });
}
